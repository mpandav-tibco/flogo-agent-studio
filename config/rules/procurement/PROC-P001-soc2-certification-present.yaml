rule:
  id: PROC-P001
  enabled: true
  severity: GOOD
  category: security
  title: SOC 2 or ISO 27001 Certification Referenced
  description: >
    The vendor references SOC 2 or ISO 27001 certification. Independent
    third-party security validation is a strong positive signal for procurement
    risk management. This satisfies a common due diligence requirement.
  tags: [procurement, soc2, iso27001, certification, security]

  applies_to: [.txt, .md, .pdf, .docx]
  parser: text

  scope: line

  match:
    type: regex_match
    path: content
    pattern: "(?i)(soc.?2.{0,20}type.?ii|iso.?27001.{0,20}certif|fedramp.{0,20}(authorized|certif)|pci.{0,10}dss.{0,20}compliant|hipaa.{0,20}attested)"

  location: "proposal:security-section"
  recommendation: >
    Security certification detected. Complete due diligence:
    (1) Obtain the actual report or certificate (not just the marketing claim)
    (2) Verify current validity (SOC 2: dated within 12 months; ISO 27001: within 3 years)
    (3) Check the scope boundary — does it cover the specific services you are procuring?
    (4) For SOC 2: read the exceptions section — management responses reveal operational maturity
    (5) Request the vendor's remediation timeline for any noted exceptions
