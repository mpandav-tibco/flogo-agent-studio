rule:
  id: SEC-001
  enabled: true
  severity: ERROR
  category: secrets-management
  title: Plaintext Secret or Password in Configuration File
  description: >
    A plaintext credential, password, or API key was detected in a configuration
    file. Configuration files are often committed to version control, stored
    in shared locations, or included in container images — all of which expose
    the secret to unintended audiences.
  tags: [security, secrets, credentials, soc2, iso27001-a9]

  applies_to: [.yaml, .yml, .json, .properties, .conf, .cfg, .ini, .env, .toml]
  parser: text

  scope: line

  match:
    type: regex_match
    path: content
    pattern: "(?i)(password|passwd|secret|api_key|apikey|access_key|private_key|auth_token|db_pass|database_password)\\s*[=:]+\\s*[\"']?[^\"'${}\\s\\[<]{6,}[\"']?"

  location: "config:{{.Scope.name}}"
  recommendation: >
    Replace plaintext credentials with references to a secrets store:
    - Kubernetes: use Secrets (mounted as env vars, not configmaps)
    - Docker Compose: use Docker secrets or .env files excluded from git
    - CI/CD: use pipeline secret variables (GitHub Actions secrets, GitLab CI variables)
    - Application: use HashiCorp Vault, AWS Secrets Manager, or Azure Key Vault
    - Minimum: environment variable reference (${SECRET_NAME}) with the actual value in .env
      that is listed in .gitignore
    Audit git history for previously committed secrets and rotate them.
