rule:
  id: SEC-003
  enabled: true
  severity: ERROR
  category: access-control
  title: Default or Well-Known Credentials Detected
  description: >
    Default credentials (admin/admin, root/root, test/test, changeme) were
    detected in configuration or source files. Default credentials are the
    first thing attackers try — they are the leading cause of internet-facing
    database and service compromise. This violates virtually every compliance
    framework including CIS Benchmarks, NIST 800-53, and ISO 27001.
  tags: [security, default-credentials, access-control, soc2, cis]

  applies_to: [.yaml, .yml, .json, .properties, .conf, .cfg, .ini, .env, .txt]
  parser: text

  scope: line

  match:
    type: regex_match
    path: content
    pattern: "(?i)(admin[\"']?\\s*[=:,]+\\s*[\"']?admin|root[\"']?\\s*[=:,]+\\s*[\"']?(root|toor)|password[\"']?\\s*[=:,]+\\s*[\"']?(password|Password1|123456|changeme|default|test|letmein)|user[\"']?\\s*[=:,]+\\s*[\"']?test)"

  location: "config:{{.Scope.name}}"
  recommendation: >
    Immediately replace default credentials with strong, unique values:
    (1) Generate credentials using a password manager or secrets generator
        (minimum 20 chars, mixed case + digits + symbols)
    (2) Store in a secrets manager — never in the configuration file
    (3) Enable automated credential rotation (90-day maximum for privileged accounts)
    (4) Audit all environments (dev, staging, prod) — default credentials often
        persist longest in lower environments which share infrastructure
    (5) Implement credential scanning in CI (truffleHog, detect-secrets, Gitleaks)
