rule:
  id: DOCKER-005
  enabled: true
  severity: ERROR
  category: security
  title: Secret or Password Hardcoded in ENV Instruction
  description: >
    A secret, password, or API key appears to be hardcoded in an ENV instruction.
    Environment variables set with ENV are baked into the image and visible in
    'docker inspect', image layers, and any container inheriting from this image.
    They also appear in docker-compose files committed to version control.
  tags: [docker, security, secrets, credentials, env]

  applies_to: [Dockerfile, .dockerfile]
  parser: text

  scope: line

  match:
    type: regex_match
    path: content
    pattern: "(?i)^ENV\\s+(PASSWORD|PASSWD|SECRET|API_KEY|APIKEY|ACCESS_KEY|AUTH_TOKEN|DB_PASS|PRIVATE_KEY)\\s*=?\\s*[^$\"'\\s{][^\\s]{4,}"

  location: "dockerfile:ENV"
  recommendation: >
    Never bake secrets into Docker images. Use runtime injection instead:

    # Wrong — baked into the image permanently
    ENV API_KEY=sk-abc123xyz

    # Correct option 1: Docker runtime environment variable (not in image)
    docker run -e API_KEY=$API_KEY myimage

    # Correct option 2: Docker secrets (Swarm/Compose)
    secrets:
      api_key:
        external: true
    environment:
      API_KEY_FILE: /run/secrets/api_key

    # Correct option 3: .env file excluded from git
    docker run --env-file .env myimage

    # Correct option 4: Kubernetes Secret
    envFrom:
      - secretRef:
          name: app-secrets

    Use BuildKit --secret for build-time secrets (never ARG for secrets):
    RUN --mount=type=secret,id=api_key cat /run/secrets/api_key
