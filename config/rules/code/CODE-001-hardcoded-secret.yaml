rule:
  id: CODE-001
  enabled: true
  severity: ERROR
  category: security
  title: Hardcoded Secret, Password, or API Key
  description: >
    A potential hardcoded credential was detected. Secrets embedded directly
    in source code are committed to version control and visible to anyone
    with repo access — including in git history after deletion. This is
    a top-10 OWASP vulnerability (A07:2021 Identification and Authentication Failures).
  tags: [security, secrets, credentials, owasp, hardcoded]

  applies_to: [.py, .js, .ts, .java, .go, .cs, .rb, .php, .sh, .env]
  parser: text

  scope: line

  match:
    type: regex_match
    path: content
    pattern: "(?i)(password|passwd|secret|api_key|apikey|access_key|private_key|auth_token|bearer)\\s*[=:]+\\s*[\"'][^\"'${}\\s]{8,}[\"']"

  location: "code:{{.Scope.name}}"
  recommendation: >
    Replace hardcoded credentials with environment variable references:
    - Python: os.environ["SECRET_NAME"] or python-dotenv
    - Node.js: process.env.SECRET_NAME
    - Java: System.getenv("SECRET_NAME") or Spring @Value
    - Go: os.Getenv("SECRET_NAME")
    Use a secrets manager (AWS Secrets Manager, HashiCorp Vault, Azure Key Vault)
    for production. Rotate any credentials that have already been committed.
    Run 'git log --all -p | grep -i password' to confirm history is clean;
    use git-filter-repo or BFG Repo Cleaner if secrets appear in history.
