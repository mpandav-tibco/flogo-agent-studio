rule:
  id: FLOGO-008
  enabled: true
  severity: ERROR
  category: security
  title: Hardcoded Credential in HTTP Header
  description: >
    Activity "{{.Scope.name}}" in flow "{{.Parent.name}}" has a
    credential-bearing HTTP header (Authorization, X-API-Key, X-Auth-Token)
    set to a literal value. Hardcoded secrets are committed to version
    control and leak in diffs and audit logs.
  tags: [security, credentials, http, secrets]

  applies_to: [.flogo, .json]
  parser: json

  scope: $.resources[*].data.tasks[*]

  when:
    type: contains_any
    path: activity.ref
    substrings:
      - "contrib/activity/rest"
      - "activity/rest"
      - "activity/http"

  match:
    type: credential_header_literal
    header_names:
      - Authorization
      - X-API-Key
      - X-Auth-Token
      - X-Secret
      - X-Api-Secret
    path: activity.input.headers

  location: "flow:{{.Parent.name}} / activity:{{.Scope.name}}"
  recommendation: >
    Replace hardcoded credential values with app property references
    (e.g. =$property["AUTH_TOKEN"]) and inject values via environment
    variables or a secrets manager at runtime.
