# Port Registry — Flogo Agent Studio
#
# All services use the 7000-7099 range to avoid conflicts with:
#   80xx — common web servers, Weaviate (8080), Ollama (11434)
#   90xx — RAG pipeline (9191), SN MCP wrapper (9090)
#   30xx/40xx/50xx — dev servers, databases, system services
#
# Add new ports here BEFORE creating the service. Never reuse a released port.

flogo_services:

  rule-engine:
    port: 7097
    description: "Generic YAML rule engine — POST /api/analyze, GET /api/health (note: port 7000 is taken by macOS AirPlay on Ventura+)"
    app: "apps/rule-engine-service.flogo"
    status: active

  agent-chat:
    port: 7001
    description: "Agent chat service — POST /api/chat, POST /api/chat/retrieve, POST /api/chat/agent (OOTB agentactivity), GET /api/health"
    app: "apps/agent-chat-service.flogo"
    status: active  # Phase 1

  ingestion:
    port: 7002
    description: "KB ingestion service — POST /api/ingest, POST /api/ingest/upload, POST /api/ingest/collection, GET /api/health"
    app: "apps/ingestion-service.flogo"
    status: active  # Phase 1

  feedback:
    port: 7003
    description: "Feedback service — merged into platform-service (port 7020). Port 7003 retired."
    app: "apps/feedback-service.flogo"
    status: merged  # Merged into platform-service (design + feedback combined binary, port 7020)

  config:
    port: 7004
    description: "Multi-agent registry — superseded by design-service (7020) which owns all agent CRUD. Source and binary removed."
    status: retired  # Retired: agent registry moved to design-service (7020) with PostgreSQL backing

  sse-stream:
    port: 7005
    description: "SSE streaming — merged into agent-chat-service. Port 7005 is now the SSE REST trigger of the merged binary."
    status: merged  # Merged into agent-chat-service binary (port 7001 chat, 7005 SSE REST, 7099 SSE events)

  platform-service:
    port: 7020
    description: "Platform service (design + feedback merged) — agent CRUD /api/v1/agents/*, templates, config, feedback /api/feedback/*, GET /api/health"
    app: "services/platform/flogo/platform-service.flogo"
    status: active  # Merged: design-service (7020) + feedback-service (7003)

  # 7006-7009 reserved for future Flogo services

  agent-builder:
    port: 7010
    description: "Agent Builder backend — POST /api/agent-builder/generate, POST /api/agent-builder/improve, POST /api/agent-builder/validate, GET /api/health"
    app: "apps/agent-builder-service.flogo"
    status: active  # Phase 2

  mcp-server:
    port: 7333
    description: "Flogo Agent Studio MCP Server ('flogo-dev-assist'). Exposes analyze_flogo, rag_chat, list_agents, get_agent, submit_feedback, get_feedback as MCP tools. Registered in .mcp.json."
    app: "apps/mcp-server.flogo"
    status: active  # Phase 2

other_services:

  deploy:
    port: 7030
    description: "Deploy service — POST/DELETE/GET /api/v1/agents/{agentId}/deploy (activate/deactivate), GET /api/v1/agents/{agentId}/export/kubernetes|docker-compose (manifest generation), GET /api/health"
    app: "apps/deploy-service.flogo"
    status: retired  # v1: functionality absorbed into runtime-manager (deployment.py port 7050)

  chainlit-ui:
    port: 7080
    description: "Chainlit chat UI — shared/dev mode (AGENT_ID not set). Multi-agent selector, RAG chat, feedback. Run: chainlit run chainlit/app.py --port 7080"
    service: "services/agent/ui/chainlit/app.py"
    status: active  # Phase 2

  runtime-manager:
    port: 7050
    description: "Runtime Manager — manages per-agent process groups. REST: POST/DELETE /api/agents/{id}/start|stop, GET /api/agents, GET /api/health. Started by start-all.sh after platform services."
    service: "services/runtime-manager.py"
    status: active

agent_runtime_pool:
  description: >
    Per-agent isolated process groups spawned by runtime-manager.
    Each deployed (active) agent occupies one slot.
    Slot N → base port = 7200 + N×10. Up to 10 concurrent agents.
    In K8s, ports are internal to the agent pod — Ingress handles external routing.
  slots: 10
  ports_per_slot: 10
  base_port: 7200
  slot_layout:
    chat_service:   "base + 1  (agent-chat-service — RAG chat + SSE streaming, merged)"
    sse_rest:       "base + 2  (agent-chat-service SSE REST trigger, merged)"
    sse_events:     "base + 3  (agent-chat-service SSE event bus trigger, merged)"
    ingestion:      "base + 4  (ingestion-service)"
    chainlit_ui:    "base + 5  (chainlit, AGENT_ID baked in)"
  examples:
    slot_0: "7201 / 7202 / 7203 / 7204 / 7205"
    slot_9: "7291 / 7292 / 7293 / 7294 / 7295"

external_dependencies:

  weaviate-http:
    port: 8080
    description: "Weaviate vector database — HTTP API"
    managed_by: docker-compose

  weaviate-grpc:
    port: 50051
    description: "Weaviate gRPC port"
    managed_by: docker-compose

  ollama:
    port: 11434
    description: "Ollama LLM/embedding runtime"
    managed_by: system
