name: CI

on:
  push:
    branches: ["main", "develop", "release/**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:
    inputs:
      chat_url:
        description: "Agent /api/chat URL to evaluate (overrides repo var EVAL_CHAT_URL)"
        required: false
      rageval_url:
        description: "rageval base URL (overrides repo var EVAL_RAGEVAL_URL)"
        required: false
      goldenset:
        description: "Path to the golden-set file"
        required: false
        default: "tests/eval/goldenset.devops.json"
  schedule:
    - cron: "0 6 * * *"   # nightly 06:00 UTC — agent quality eval (no-ops if no target configured)

env:
  FLOGO_IMAGE: tibco/flogo-agent-studio
  # flogobuild context name used on CI (linux build context)
  BUILD_CONTEXT: flogo-linux

jobs:
  # ── Job 1: Build Flogo binaries & run smoke tests ─────────────────────────
  build:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Make flogobuild executable
        run: chmod +x tools/flogobuild/linux_amd64/flogobuild

      - name: Set up flogobuild PATH shim
        run: |
          # Create a minimal go-wrapper for CI (no cross-compile needed)
          mkdir -p tools/go-wrapper-ci
          cat > tools/go-wrapper-ci/go <<'SH'
          #!/bin/bash
          if [ "$1" = "mod" ] && [ "$2" = "tidy" ]; then
            exec /usr/local/go/bin/go mod tidy -e "${@:3}"
          fi
          exec /usr/local/go/bin/go "$@"
          SH
          chmod +x tools/go-wrapper-ci/go
          echo "$GITHUB_WORKSPACE/tools/flogobuild/linux_amd64" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/tools/go-wrapper-ci" >> $GITHUB_PATH

      - name: Initialise flogobuild context (flogo-linux / 2.26.3)
        run: |
          flogobuild init-context \
            -n flogo-linux \
            -e /usr/local/go/bin/go \
            -v "$GITHUB_WORKSPACE/.vscode-ext/tibco.flogo-2.26.3" \
          || true
          # List contexts to confirm
          flogobuild list-contexts 2>/dev/null || true
        env:
          FLOGO_VSCODE_EXT_PATH: ""

      # Build each service (fail-fast: if one fails, we still see the rest)
      - name: Build rule-engine-service
        run: |
          flogobuild build-exe \
            -f services/agent/flogo/rule-engine-service.flogo \
            -c flogo-linux -n rule-engine-service -o bin/

      - name: Build agent-chat-service
        run: |
          flogobuild build-exe \
            -f services/agent/flogo/agent-chat-service.flogo \
            -c flogo-linux -n agent-chat-service -o bin/

      - name: Build ingestion-service
        run: |
          flogobuild build-exe \
            -f services/agent/flogo/ingestion-service.flogo \
            -c flogo-linux -n ingestion-service -o bin/

      - name: Build platform-service
        run: |
          flogobuild build-exe \
            -f services/platform/flogo/platform-service.flogo \
            -c flogo-linux -n platform-service -o bin/

      - name: Build mcp-server
        run: |
          flogobuild build-exe \
            -f services/platform/flogo/mcp-server.flogo \
            -c flogo-linux -n mcp-server -o bin/

      - name: Build agent-builder-service
        run: |
          flogobuild build-exe \
            -f services/platform/flogo/agent-builder-service.flogo \
            -c flogo-linux -n agent-builder-service -o bin/ || true  # optional service

      - name: Upload binaries as artifact
        uses: actions/upload-artifact@v4
        with:
          name: flogo-binaries-${{ github.sha }}
          path: bin/
          retention-days: 7

  # ── Job 2: TypeScript / UI build & lint ───────────────────────────────────
  ui:
    name: Forge UI Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/platform/ui/forge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/platform/ui/forge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ── Job 3: Python — lint + unit/functional tests ──────────────────────────
  tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flogo_agent_studio
          POSTGRES_USER: flogo
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flogo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install --quiet aiohttp asyncpg requests pytest

      - name: Create DB schema
        run: |
          PGPASSWORD=changeme psql -h localhost -U flogo -d flogo_agent_studio \
            -f deployment/docker/postgres/init.sql

      - name: Run functional tests (offline subset)
        run: |
          # Run only tests that don't require live Flogo services
          python3 -m pytest tests/functional_tests.py -x -q \
            --ignore=tests/e2e_functional.py \
            --ignore=tests/e2e_journey.py \
            2>/dev/null || true
        env:
          DB_DSN: postgresql://flogo:changeme@localhost:5432/flogo_agent_studio

      - name: Validate eval harness (compile + goldenset + graceful-skip)
        run: |
          # 1) harness compiles and the golden set is valid JSON
          python3 -m py_compile tests/eval/eval_harness.py
          python3 -c "import json; json.load(open('tests/eval/goldenset.devops.json'))"
          # 2) with rageval unreachable the harness must exit gracefully (code 2), not crash.
          #    This proves the wiring on every PR without needing the full Ollama/Weaviate stack.
          set +e
          python3 tests/eval/eval_harness.py \
            -g tests/eval/goldenset.devops.json \
            --rageval-url http://127.0.0.1:1 --timeout 5
          rc=$?
          set -e
          if [ "$rc" != "2" ]; then
            echo "::error::eval harness should exit 2 when rageval is unreachable, got $rc"
            exit 1
          fi
          echo "eval harness self-test passed (graceful skip on unreachable rageval)"

  # ── Job 4: Docker build & push (main branch only) ─────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build, ui]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: flogo-binaries-${{ github.sha }}
          path: bin/

      - name: Make binaries executable
        run: chmod +x bin/*

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute version tag
        id: version
        run: |
          SHA_SHORT="${GITHUB_SHA::8}"
          echo "tag=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build and push agent-chat-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/agent-chat-service/Dockerfile
          push: true
          tags: |
            ${{ env.FLOGO_IMAGE }}:agent-chat-latest
            ${{ env.FLOGO_IMAGE }}:agent-chat-${{ steps.version.outputs.tag }}
          platforms: linux/amd64

      - name: Build and push ingestion-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/ingestion-service/Dockerfile
          push: true
          tags: |
            ${{ env.FLOGO_IMAGE }}:ingestion-latest
            ${{ env.FLOGO_IMAGE }}:ingestion-${{ steps.version.outputs.tag }}
          platforms: linux/amd64

      - name: Build and push rule-engine-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/rule-engine-service/Dockerfile
          push: true
          tags: |
            ${{ env.FLOGO_IMAGE }}:rule-engine-latest
            ${{ env.FLOGO_IMAGE }}:rule-engine-${{ steps.version.outputs.tag }}
          platforms: linux/amd64

      - name: Build and push platform-service
        if: hashFiles('deployment/docker/platform-service/Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/platform-service/Dockerfile
          push: true
          tags: |
            ${{ env.FLOGO_IMAGE }}:platform-service-latest
            ${{ env.FLOGO_IMAGE }}:platform-service-${{ steps.version.outputs.tag }}
          platforms: linux/amd64

      - name: Build and push mcp-server
        if: hashFiles('deployment/docker/mcp-server/Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/mcp-server/Dockerfile
          push: true
          tags: |
            ${{ env.FLOGO_IMAGE }}:mcp-server-latest
            ${{ env.FLOGO_IMAGE }}:mcp-server-${{ steps.version.outputs.tag }}
          platforms: linux/amd64

      - name: Summarise pushed images
        run: |
          echo "### Docker images pushed" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          for svc in agent-chat ingestion rule-engine platform-service mcp-server; do
            echo "| $svc | ${{ steps.version.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
          done

  # ── Job 5: Agent RAG quality eval (rageval) ───────────────────────────────
  # The full eval stack (Ollama models, Weaviate collections, a deployed agent,
  # rageval) is too heavy for ephemeral CI, so this job evaluates a REACHABLE
  # deployed/staging environment instead. It runs on demand (workflow_dispatch)
  # and nightly (schedule), and no-ops cleanly when no target is configured.
  #
  # To enable: set repository Variables EVAL_CHAT_URL and EVAL_RAGEVAL_URL
  # (Settings → Secrets and variables → Actions → Variables), or pass them as
  # workflow_dispatch inputs. The job fails if the agent's quality gate fails.
  agent-eval:
    name: Agent RAG Quality Eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run agent quality eval against target environment
        id: eval
        env:
          IN_CHAT:      ${{ github.event.inputs.chat_url }}
          IN_RAGEVAL:   ${{ github.event.inputs.rageval_url }}
          IN_GOLDENSET: ${{ github.event.inputs.goldenset }}
          VAR_CHAT:     ${{ vars.EVAL_CHAT_URL }}
          VAR_RAGEVAL:  ${{ vars.EVAL_RAGEVAL_URL }}
        run: |
          CHAT="${IN_CHAT:-$VAR_CHAT}"
          RAGEVAL="${IN_RAGEVAL:-$VAR_RAGEVAL}"
          GOLDENSET="${IN_GOLDENSET:-tests/eval/goldenset.devops.json}"
          if [ -z "$CHAT" ] || [ -z "$RAGEVAL" ]; then
            echo "::warning::No eval target configured — set repo Variables EVAL_CHAT_URL and EVAL_RAGEVAL_URL (or provide workflow_dispatch inputs) to enable live quality eval. Skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tests/eval/eval_harness.py \
            -g "$GOLDENSET" \
            --chat-url "$CHAT" \
            --rageval-url "$RAGEVAL" \
            --json-out eval-report.json

      - name: Upload eval report
        if: always() && steps.eval.outputs.skipped != 'true' && hashFiles('eval-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report-${{ github.run_id }}
          path: eval-report.json
          retention-days: 30
