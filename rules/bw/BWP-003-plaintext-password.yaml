rule:
  id: BWP-003
  enabled: true
  severity: ERROR
  category: security
  title: Plaintext Password in Process or Binding
  description: >
    Resource "{{.Scope.name}}" contains a field named password, passwd, or
    credential with a non-empty literal string value. Plaintext passwords in
    process definitions are exposed in source control and EAR backups.
  tags: [security, credentials, password, plaintext, bw]

  applies_to: [.process, .bwp, .xml, .substvar]
  parser: xml

  scope: //*[local-name()='password' or local-name()='passwd' or local-name()='credential']

  match:
    type: not_empty
    path: text()

  location: "resource:{{.Scope.name}}"
  recommendation: >
    Use Obfuscated Global Variables (BW obfuscation) or reference an
    external secrets manager. In BW6/BW CE use the Credential Vault or
    inject the password via an environment variable bound to a Module
    Property. Never store cleartext passwords in .substvar or .bwp files
    committed to version control.
