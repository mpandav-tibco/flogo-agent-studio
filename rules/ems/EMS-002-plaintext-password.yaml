rule:
  id: EMS-002
  enabled: true
  severity: ERROR
  category: security
  title: EMS Password Stored in Plaintext
  description: >
    EMS configuration "{{.Scope.name}}" contains a password field with a
    non-obfuscated value. Plaintext passwords in config files are exposed
    to anyone with filesystem access or access to version control.
  tags: [security, credentials, password, plaintext, ems]

  applies_to: [.conf, .cfg, .properties]
  parser: text

  scope: file

  match:
    type: regex_match
    path: content
    pattern: "(?m)^\\s*(password|passwd|server_password|jaas_password)\\s*=\\s*(?!#)(?!\\{obf:\\})(?!\\$\\{).+"

  location: "config:{{.Scope.name}}"
  recommendation: >
    Obfuscate passwords using TIBCO EMS obfuscation: run
    `tibemsadmin -obfuscate <password>` and store the result as
    {obf:xxxxx}. For production, inject the obfuscated value via an
    environment variable or a secrets management system (Vault, AWS SSM).
    Never commit plaintext passwords to version control.
