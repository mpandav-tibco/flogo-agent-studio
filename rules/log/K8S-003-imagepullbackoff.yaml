rule:
  id: K8S-003
  enabled: true
  severity: ERROR
  category: kubernetes
  title: ImagePullBackOff — Container Image Cannot Be Pulled
  description: >
    Kubernetes cannot pull the container image. The pod will remain in
    Pending state and no new instances will start until the image is
    accessible.
  tags: [kubernetes, image, registry, deployment]

  applies_to: [.log, .txt]
  parser: text

  scope: line

  match:
    type: regex_match
    path: content
    pattern: "ImagePullBackOff|ErrImagePull|image pull failed|unauthorized.*registry"

  location: "log:{{.Scope.name}}"
  recommendation: >
    Common causes: (1) Wrong image tag — check the deployment spec,
    especially if using :latest which may not exist in the registry.
    (2) Registry credentials missing — verify the imagePullSecret is
    correct and mounted in the correct namespace.
    (3) Registry unreachable — confirm network connectivity from nodes.
    Run: kubectl describe pod <pod-name> and inspect the Events section
    for the exact pull error message.
