<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AgentForge">
  <title>AgentForge</title>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3bbfbb"/>
      <stop offset="100%" stop-color="#2a9e9a"/>
    </linearGradient>
  </defs>
  <!-- Hexagon -->
  <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="url(#g)"/>
  <!-- Flow S-curve -->
  <path d="M 6,21 C 10,13 22,19 26,11"
        fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Agent nodes -->
  <circle cx="6"  cy="21" r="3"   fill="#f9ea35"/>
  <circle cx="16" cy="16" r="2.5" fill="white"/>
  <circle cx="26" cy="11" r="3"   fill="#f9ea35"/>
</svg>
