server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Deploy/export endpoints — must come before /api/v1 catch-all
    location ~ ^/api/v1/agents/[^/]+/deploy {
        proxy_pass http://deploy-service:7030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/api/v1/agents/[^/]+/export {
        proxy_pass http://deploy-service:7030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Design service
    location /api/v1/ {
        proxy_pass http://design-service:7020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Agent builder service
    location /api/agent-builder/ {
        proxy_pass http://agent-builder:7010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Feedback service
    location /api/feedback/ {
        proxy_pass http://feedback:7003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback — serve index.html for all non-API routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
