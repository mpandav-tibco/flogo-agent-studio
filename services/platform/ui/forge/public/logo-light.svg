<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-label="AgentForge Studio">
  <title>AgentForge Studio</title>
  <defs>
    <linearGradient id="hexGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3bbfbb"/>
      <stop offset="100%" stop-color="#2a9e9a"/>
    </linearGradient>
    <linearGradient id="glowGradL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcf2f0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3bbfbb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Hexagon icon background -->
  <polygon points="30,7 52,19.5 52,44.5 30,57 8,44.5 8,19.5"
           fill="url(#hexGradL)"/>
  <!-- Subtle inner highlight -->
  <polygon points="30,7 52,19.5 52,44.5 30,57 8,44.5 8,19.5"
           fill="url(#glowGradL)"/>
  <!-- Hexagon border -->
  <polygon points="30,7 52,19.5 52,44.5 30,57 8,44.5 8,19.5"
           fill="none" stroke="white" stroke-width="0.8" stroke-opacity="0.35"/>

  <!-- Flogo-inspired flow S-curve (white) -->
  <path d="M 11,44 C 17,26 43,38 49,20"
        fill="none" stroke="white" stroke-width="3.2"
        stroke-linecap="round" opacity="0.92"/>

  <!-- Agent nodes on the flow: yellow → white → yellow -->
  <circle cx="11" cy="44" r="5" fill="#f9ea35"/>
  <circle cx="11" cy="44" r="3" fill="#ffce2d"/>
  <circle cx="30" cy="32" r="4" fill="white" opacity="0.95"/>
  <circle cx="49" cy="20" r="5" fill="#f9ea35"/>
  <circle cx="49" cy="20" r="3" fill="#ffce2d"/>

  <!-- Wordmark: "Agent" dark + "Forge" bold teal -->
  <text x="68" y="38"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="27">
    <tspan font-weight="300" fill="#2d2a26">Agent</tspan><tspan font-weight="700" fill="#3bbfbb">Forge</tspan>
  </text>

  <!-- Tagline -->
  <text x="69" y="54"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="10" letter-spacing="0.4"
        fill="#3bbfbb">powered by Flogo</text>
</svg>
